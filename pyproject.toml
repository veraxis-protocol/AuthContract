[project]
name = "authcontract"
version = "0.0.1"
description = "AuthContract reference implementation — canonical digest and runtime fact admissibility"
requires-python = ">=3.10"
dependencies = ["rfc8785>=0.1.2"]

[project.scripts]
authcontract = "authcontract.cli:main"

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["authcontract*"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
